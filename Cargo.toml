[workspace]
members = ["crates/search-core", "crates/search-jni", "crates/search-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
search-core = { path = "crates/search-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
